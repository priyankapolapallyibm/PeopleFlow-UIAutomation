# =============================================================================
# PR Gate Check — runs Smoke suite on every PR to main
# Blocks merge if any Smoke test fails
# =============================================================================

name: PR Gate — Smoke Check

on:
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened ]

env:
  DOTNET_VERSION: '8.0.x'
  PROJECT_PATH: src/PeopleFlow.UIAutomation/PeopleFlow.UIAutomation.csproj

jobs:
  smoke-gate:
    name: Smoke Gate (PR #${{ github.event.number }})
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}

      - name: Restore & Build
        run: |
          dotnet restore ${{ env.PROJECT_PATH }}
          dotnet build ${{ env.PROJECT_PATH }} --no-restore --configuration Release

      - name: Install Playwright
        run: |
          pwsh src/PeopleFlow.UIAutomation/bin/Release/net8.0/playwright.ps1 install --with-deps chromium

      - name: Run Smoke Tests
        env:
          AppSettings__Headless: true
          AppSettings__BaseUrl: http://localhost:80
          AppSettings__ApiBaseUrl: http://localhost:3000/api
        run: |
          dotnet test ${{ env.PROJECT_PATH }} \
            --no-build --configuration Release \
            --filter "Category=Smoke" \
            --logger "trx;LogFileName=smoke-results.trx" \
            --results-directory TestResults

      - name: Publish Smoke Results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Smoke Results — PR #${{ github.event.number }}
          path: TestResults/*.trx
          reporter: dotnet-trx

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-pr-${{ github.event.number }}
          path: TestResults/
